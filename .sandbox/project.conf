# .sandbox/project.conf — beadwatch
PROJECT_NAME=beadwatch

# Binaries to build (space-separated "name:path" pairs)
PROJECT_BINS="beadwatch:./cmd/beadwatch"

# Build system (make or mage)
BUILD_SYSTEM=make

# Single fleet pin for golangci-lint. CI and the sandbox both read this key —
# there is exactly one place this version is written (bw-ajp, mirroring
# strand's lint-pin convention).
GOLANGCI_LINT_VERSION=v2.12.2
